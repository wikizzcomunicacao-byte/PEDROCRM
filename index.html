<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Fluxo CRM</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Figtree:wght@400..700&display=swap">
  <style>
  :root {
    color-scheme: light;
    box-sizing: border-box;
    --bg:#f1f2f4; --surface:#ffffff; --surface-2:#f6f7f9; --line:#e3e5ea; --line-strong:#cdd0d8;
    --fg:#0d0e12; --fg-2:#3a3d47; --muted:#6a6e7b;
    --accent:#5a56e8; --accent-fg:#ffffff; --accent-soft:rgba(90,86,232,.10);
    --green:#14883f; --green-soft:rgba(20,136,63,.12);
    --amber:#b86a05; --amber-soft:rgba(184,106,5,.13);
    --red:#d32f3f; --red-soft:rgba(211,47,63,.11);
    --blue:#2563eb; --blue-soft:rgba(37,99,235,.11);
    --shadow:0 1px 2px rgba(13,14,18,.05),0 10px 26px -14px rgba(13,14,18,.16);
    --overlay:rgba(13,14,18,.46);
    --k-blue:#3b82f6; --k-violet:#8b5cf6; --k-green:#22a55b; --k-amber:#e0a019; --k-rose:#e5546d; --k-slate:#7b8194;
    --pane-bg:#0d0e12; --pane-fg:#f3f4f6; --pane-muted:#8e93a1; --pane-line:#262831;
    --f-display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
    --f-body:'Figtree','Segoe UI',system-ui,-apple-system,sans-serif;
  }
  [data-theme="dark"]{
    --bg:#0a0b0e; --surface:#131419; --surface-2:#1a1b21; --line:#25272f; --line-strong:#363944;
    --fg:#f3f4f6; --fg-2:#c6c9d2; --muted:#888c99;
    --accent:#8c88ff; --accent-fg:#0a0b0e; --accent-soft:rgba(140,136,255,.15);
    --green:#3ddc97; --green-soft:rgba(61,220,151,.13);
    --amber:#f5b942; --amber-soft:rgba(245,185,66,.14);
    --red:#ff7a8a; --red-soft:rgba(255,122,138,.13);
    --blue:#6ea8ff; --blue-soft:rgba(110,168,255,.14);
    --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 28px -14px rgba(0,0,0,.7);
    --overlay:rgba(0,0,0,.62);
    color-scheme:dark;
  }
  *,*::before,*::after{box-sizing:border-box}
  html,body{height:100%; margin:0; padding:0}
  body{background:var(--bg); color:var(--fg); font-family:var(--f-body); font-size:14px; line-height:1.45; padding:16px; overflow:hidden}
  #root{height:100%}
  h1,h2,h3,p{margin:0}
  h1,h2,h3{font-family:var(--f-display); letter-spacing:-.01em}
  button,input,select,textarea{font:inherit; color:inherit}
  button{cursor:pointer}
  .ic{flex:none}
  .muted{color:var(--muted)}
  .num{font-variant-numeric:tabular-nums}
  .btn{display:inline-flex; align-items:center; justify-content:center; gap:8px; height:38px; padding:0 14px; border-radius:12px; border:1px solid var(--line-strong); background:var(--surface); font-weight:600; white-space:nowrap; transition:background .15s}
  .btn:hover{background:var(--surface-2)}
  .btn.sm{height:32px; padding:0 11px; font-size:13px; border-radius:10px}
  .btn-primary{background:var(--fg); color:var(--bg); border-color:var(--fg)}
  .btn-primary:hover{opacity:.9}
  .btn-danger{background:var(--red); border-color:var(--red); color:#fff}
  .icon-btn{display:inline-grid; place-items:center; width:34px; height:34px; border-radius:10px; border:1px solid transparent; background:transparent; color:var(--muted)}
  .icon-btn:hover{background:var(--surface-2); color:var(--fg)}
  .icon-btn.sm{width:28px; height:28px}
  .icon-btn.danger:hover{background:var(--red-soft); color:var(--red)}
  .icon-btn.ok:hover{background:var(--green-soft); color:var(--green)}
  .field{display:flex; flex-direction:column; gap:6px; min-width:0}
  .field>label{font-size:12px; font-weight:600; color:var(--fg-2)}
  .field input,.field select,.field textarea{width:100%; background:var(--surface-2); border:1px solid var(--line); border-radius:12px; padding:10px 12px}
  .field input:focus,.field select:focus,.field textarea:focus{outline:none; border-color:var(--accent); background:var(--surface)}
  .row2{display:grid; grid-template-columns:1fr 1fr; gap:12px}
  .login{height:100%; display:grid; grid-template-columns:1.15fr 1fr; gap:16px; overflow:auto}
  .pane{background:var(--pane-bg); color:var(--pane-fg); border-radius:28px; padding:36px; display:flex; flex-direction:column; justify-content:space-between; border:1px solid var(--pane-line)}
  .pane h1{font-size:clamp(30px,4.2vw,50px); line-height:1.02; max-width:14ch}
  .login-form-wrap{display:grid; place-items:center; padding:12px}
  .login-box{width:min(380px,100%); display:flex; flex-direction:column; gap:22px}
  .login-box h2{font-size:30px}
  .err{background:var(--red-soft); color:var(--red); border:1px solid var(--red); border-radius:12px; padding:10px 12px; font-weight:600; font-size:13px}
  .app{display:flex; gap:16px; height:100%}
  .side{width:240px; flex:none; background:var(--surface); border:1px solid var(--line); border-radius:22px; padding:14px; display:flex; flex-direction:column; gap:6px; box-shadow:var(--shadow)}
  .side.collapsed{width:70px}
  .side.collapsed .lbl{display:none}
  .logo{display:flex; align-items:center; gap:10px; font-family:var(--f-display); font-weight:700; font-size:20px}
  .logo-mark{width:32px; height:32px; border-radius:10px; background:var(--fg); color:var(--bg); display:grid; place-items:center}
  .nav{display:flex; flex-direction:column; gap:4px}
  .nav-i{display:flex; align-items:center; gap:12px; height:42px; padding:0 12px; border-radius:12px; border:0; background:transparent; color:var(--muted); font-weight:600; text-align:left; width:100%}
  .nav-i:hover{background:var(--surface-2); color:var(--fg)}
  .nav-i.on{background:var(--fg); color:var(--bg)}
  .side-foot{margin-top:auto; display:flex; flex-direction:column; gap:4px; border-top:1px solid var(--line); padding-top:10px}
  .user{display:flex; align-items:center; gap:10px; padding:6px}
  .av{width:30px; height:30px; border-radius:50%; background:var(--accent-soft); color:var(--accent); display:grid; place-items:center; font-weight:700; font-size:12px}
  .main{flex:1; min-width:0; overflow-y:auto; padding-right:2px; padding-bottom:24px}
  .top{display:flex; align-items:flex-start; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-bottom:20px}
  .top h1{font-size:clamp(24px,3.4vw,32px)}
  .kpis{display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:14px; margin-bottom:14px}
  .kpi{background:var(--surface); border:1px solid var(--line); border-radius:20px; padding:18px; display:flex; flex-direction:column; gap:12px; box-shadow:var(--shadow)}
  .kpi-top{display:flex; align-items:center; justify-content:space-between; color:var(--muted); font-weight:600; font-size:13px}
  .chip-ic{width:34px; height:34px; border-radius:11px; display:grid; place-items:center}
  .t-violet{background:var(--accent-soft); color:var(--accent)}
  .t-blue{background:var(--blue-soft); color:var(--blue)}
  .t-green{background:var(--green-soft); color:var(--green)}
  .kpi-val{font-family:var(--f-display); font-size:28px; font-weight:700}
  .kpi-sub{font-size:12.5px; color:var(--muted)}
  .charts{display:grid; grid-template-columns:1.7fr 1fr; gap:14px; margin-bottom:14px}
  .panel{background:var(--surface); border:1px solid var(--line); border-radius:20px; padding:18px; box-shadow:var(--shadow)}
  .panel-h{display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-bottom:14px}
  .panel-h h2{font-size:17px; font-weight:650}
  .legend{display:flex; gap:14px; font-size:12.5px; color:var(--fg-2)}
  .legend i{display:inline-block; width:10px; height:10px; border-radius:3px; margin-right:6px}
  .chart-wrap{overflow-x:auto}
  .chart-wrap svg{display:block; width:100%; min-width:460px; height:auto}
  .ax{fill:var(--muted); font-size:11px}
  .donut-wrap{display:flex; flex-direction:column; gap:16px; align-items:center}
  .donut{width:176px; height:176px}
  .donut .c1{fill:var(--fg); font-family:var(--f-display); font-weight:700; font-size:26px}
  .donut .c2{fill:var(--muted); font-size:11px}
  .dl{width:100%; display:flex; flex-direction:column; gap:8px}
  .dl div{display:flex; align-items:center; gap:8px; font-size:13px}
  .dl i{width:10px; height:10px; border-radius:3px}
  .dl .n{margin-left:auto; font-weight:600}
  .dl .p{width:42px; text-align:right; color:var(--muted)}
  .filters{display:flex; gap:8px; flex-wrap:wrap; align-items:center}
  .search{background:var(--surface-2); border:1px solid var(--line); border-radius:12px; padding:0 12px; height:34px; width:200px}
  .fchip{height:32px; padding:0 12px; border-radius:99px; border:1px solid var(--line); background:transparent; font-size:12.5px; font-weight:600; color:var(--muted)}
  .fchip.on{background:var(--fg); color:var(--bg); border-color:var(--fg)}
  .tbl-wrap{overflow-x:auto}
  table{width:100%; border-collapse:collapse; min-width:640px}
  th{font-size:11px; text-transform:uppercase; letter-spacing:.07em; color:var(--muted); text-align:left; font-weight:600; padding:8px 10px; border-bottom:1px solid var(--line)}
  td{padding:11px 10px; border-bottom:1px solid var(--line); vertical-align:middle}
  tbody tr:hover td{background:var(--surface-2)}
  .who{display:flex; align-items:center; gap:10px}
  .who .nm{font-weight:600}
  .st{appearance:none; border:1px solid transparent; border-radius:99px; padding:5px 26px 5px 11px; font-size:12.5px; font-weight:650; cursor:pointer}
  .st-neg{background-color:var(--accent-soft); color:var(--accent)}
  .st-wait{background-color:var(--amber-soft); color:var(--amber)}
  .st-ok{background-color:var(--green-soft); color:var(--green)}
  .st-no{background-color:var(--red-soft); color:var(--red)}
  .acts{display:flex; gap:2px; justify-content:flex-end}
  .empty{padding:36px 12px; text-align:center; color:var(--muted)}
  .seg{display:inline-flex; background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:3px; gap:2px}
  .seg button{height:32px; padding:0 12px; border:0; border-radius:9px; background:transparent; font-weight:600; font-size:13px; color:var(--muted)}
  .seg button.on{background:var(--fg); color:var(--bg)}
  .seg-row{margin-bottom:12px}
  .board-bar{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:14px}
  .tabs{display:flex; gap:6px}
  .tab{height:36px; padding:0 14px; border-radius:11px; border:1px solid var(--line); background:var(--surface); font-weight:600; color:var(--fg-2)}
  .tab.on{background:var(--fg); color:var(--bg); border-color:var(--fg)}
  .cols{display:flex; gap:14px; overflow-x:auto; align-items:flex-start; padding-bottom:14px}
  .col{flex:0 0 292px; width:292px; background:var(--surface-2); border:1px solid var(--line); border-radius:20px; padding:10px; display:flex; flex-direction:column; gap:10px}
  .col-head{display:flex; align-items:center; gap:8px; padding:4px}
  .col-head h3{font-size:15px; font-weight:650; flex:1}
  .count{font-size:12px; font-weight:650; color:var(--muted); background:var(--surface); border:1px solid var(--line); border-radius:99px; padding:1px 8px}
  .col-cards{display:flex; flex-direction:column; gap:9px; min-height:8px}
  .card{background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:12px; display:flex; flex-direction:column; gap:8px; box-shadow:var(--shadow)}
  .card-title{font-weight:600}
  .card-meta{display:flex; gap:6px; align-items:center; font-size:12px; color:var(--muted)}
  .cal-bar{display:flex; align-items:center; gap:10px; margin-bottom:14px}
  .cal-bar h2{font-size:21px; font-weight:700}
  .cal{display:grid; grid-template-columns:repeat(7,1fr); background:var(--surface); border:1px solid var(--line); border-radius:20px; overflow:hidden; box-shadow:var(--shadow)}
  .dow{padding:9px 8px; font-size:11px; text-transform:uppercase; color:var(--muted); font-weight:650; border-bottom:1px solid var(--line); background:var(--surface-2); text-align:center}
  .cell{min-height:90px; padding:6px; border-right:1px solid var(--line); border-bottom:1px solid var(--line); display:flex; flex-direction:column; gap:4px}
  .cell:nth-child(7n){border-right:0}
  .cell.dim{background:var(--surface-2); opacity:.6}
  .dn{font-size:12.5px; font-weight:650; width:24px; height:24px; display:grid; place-items:center; border-radius:50%}
  .cell.today .dn{background:var(--fg); color:var(--bg)}
  .cchip{display:flex; align-items:center; gap:6px; border:0; background:color-mix(in srgb,var(--c) 16%,transparent); border-radius:7px; padding:3px 6px; font-size:11.5px; font-weight:600; color:var(--fg); width:100%; text-align:left}
  .cchip i{width:7px; height:7px; border-radius:50%; background:var(--c); flex:none}
  .overlay{position:fixed; inset:0; background:var(--overlay); z-index:100; display:grid; place-items:center; padding:16px}
  .modal{background:var(--surface); color:var(--fg); border:1px solid var(--line); border-radius:22px; width:min(480px,100%); display:flex; flex-direction:column; box-shadow:0 30px 80px -20px rgba(0,0,0,.5)}
  .modal.wide{width:min(620px,100%)}
  .m-head{display:flex; align-items:center; justify-content:space-between; padding:16px 18px 8px}
  .m-body{padding:8px 18px 14px; overflow-y:auto; display:flex; flex-direction:column; gap:14px}
  .m-foot{display:flex; gap:8px; justify-content:flex-end; padding:12px 18px 16px; border-top:1px solid var(--line)}
  .toast{position:fixed; left:50%; bottom:20px; transform:translateX(-50%); background:var(--fg); color:var(--bg); padding:10px 16px; border-radius:12px; font-weight:600; z-index:200}
  @media(max-width:860px){.pane{display:none}.login{grid-template-columns:1fr}}
  </style>
</head>
<body>
<div id="root"></div>
<script>
(function(){
  'use strict';
  var KEY='fluxo-crm-v3', USER='pedro.takahashi', PASS='29102006';
  var uid=function(){return Math.random().toString(36).slice(2,9)};
  var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
  var pad=function(n){return String(n).padStart(2,'0')};
  var iso=function(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
  var addDays=function(n){var d=new Date();d.setDate(d.getDate()+n);return iso(d)};
  var today=function(){return iso(new Date())};
  var brl=function(n){return Number(n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL',maximumFractionDigits:0})};
  var initials=function(n){return n.split(/\s+/).filter(Boolean).slice(0,2).map(function(w){return w[0]}).join('').toUpperCase()};
  var sum=function(a){return a.reduce(function(t,l){return t+l.creditValue},0)};

  var ICONS={
    dash:'<rect width="7" height="9" x="3" y="3" rx="1"/><rect width="7" height="5" x="14" y="3" rx="1"/><rect width="7" height="9" x="14" y="12" rx="1"/><rect width="7" height="5" x="3" y="16" rx="1"/>',
    kanban:'<rect width="18" height="18" x="3" y="3" rx="2"/><path d="M8 7v7"/><path d="M12 7v4"/><path d="M16 7v9"/>',
    cal:'<path d="M8 2v4"/><path d="M16 2v4"/><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M3 10h18"/>',
    users:'<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>',
    out:'<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" x2="9" y1="12" y2="12"/>',
    sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/>',
    moon:'<path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>',
    panel:'<rect width="18" height="18" x="3" y="3" rx="2"/><path d="M9 3v18"/>',
    plus:'<path d="M5 12h14"/><path d="M12 5v14"/>',
    x:'<path d="M18 6 6 18"/><path d="m6 6 12 12"/>',
    trash:'<path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/>',
    pen:'<path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/>',
    check:'<path d="M20 6 9 17l-5-5"/>',
    left:'<path d="m15 18-6-6 6-6"/>',
    right:'<path d="m9 18 6-6-6-6"/>',
    send:'<path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/>',
    filecheck:'<path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="m9 15 2 2 4-4"/>',
    pct:'<line x1="19" x2="5" y1="5" y2="19"/><circle cx="6.5" cy="6.5" r="2.5"/><circle cx="17.5" cy="17.5" r="2.5"/>',
    clock:'<circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>',
    menu:'<line x1="4" x2="20" y1="12" y2="12"/><line x1="4" x2="20" y1="6" y2="6"/><line x1="4" x2="20" y1="18" y2="18"/>',
    phone:'<path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0-0 1-8.63-3.07 19.5 19.5 0-0 1-6-6 19.79 19.79 0-0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/>'
  };
  function ic(n,s){s=s||18;return '<svg class="ic" viewBox="0 0 24 24" width="'+s+'" height="'+s+'" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'+ICONS[n]+'</svg>'}
  function logo(){return '<div class="logo"><span class="logo-mark">'+ic('kanban',18)+'</span><span class="lbl">Fluxo</span></div>'}

  var ST={
    negociacao:{label:'Em negociação',cls:'neg',color:'var(--accent)'},
    aguardando:{label:'Aguardando documentação',cls:'wait',color:'var(--amber)'},
    aceita:{label:'Vendido / Contemplado',cls:'ok',color:'var(--green)'},
    recusada:{label:'Recusado',cls:'no',color:'var(--red)'}
  };
  var SEGMENTS=['Imóvel','Automóvel','Moto','Serviços','Pesados'];

  function seed(){
    return {
      session:null, theme:null, collapsed:false, view:'dashboard',
      leads:[
        {id:uid(),name:'Carlos Alberto',phone:'(17) 99111-2233',segment:'Imóvel',creditValue:250000,installment:1450,status:'aceita',date:addDays(-14),notes:'Comprou cota para construção'},
        {id:uid(),name:'Mariana Souza',phone:'(17) 99222-3344',segment:'Automóvel',creditValue:80000,installment:920,status:'negociacao',date:addDays(-7),notes:'Quer trocar de SUV'}
      ],
      boards:[{id:uid(),name:'Consórcios - Vendas',columns:[
        {id:uid(),name:'Novos Leads',cards:[{id:uid(),title:'Ligar para Carlos Alberto',priority:'alta',due:today()}]},
        {id:uid(),name:'Em Negociação',cards:[]},
        {id:uid(),name:'Fechados',cards:[]}
      ]}],
      activeBoard:null, calMonth:today().slice(0,7), calSel:today()
    };
  }
  function load(){
    try{var r=localStorage.getItem(KEY); if(r)return JSON.parse(r);}catch(e){}
    return seed();
  }
  var S=load();
  if(!S.boards[0]) S=seed();
  if(!S.activeBoard) S.activeBoard=S.boards[0].id;
  function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}

  var root=document.getElementById('root');
  var leadQ='', leadF='native';

  function commit(){save();render();}

  function curBoard(){return S.boards.find(function(b){return b.id===S.activeBoard})||S.boards[0]}
  function monthLeads(){return S.leads}
  function stats(){
    var L=monthLeads(), sent=L.filter(function(l){return l.status!=='negociacao'}), won=L.filter(function(l){return l.status==='aceita'});
    return {total:L.length,open:L.filter(function(l){return l.status==='negociacao'||l.status==='aguardando'}).length,sentN:sent.length,sentV:sum(sent),wonN:won.length,wonV:sum(won),conv:sent.length?won.length/sent.length*100:0};
  }
  function isDark(){return S.theme?S.theme==='dark':window.matchMedia('(prefers-color-scheme: dark)').matches}
  function applyTheme(){var h=document.documentElement; if(S.theme)h.setAttribute('data-theme',S.theme); else h.removeAttribute('data-theme');}

  function loginHTML(){
    return '<div class="login"><section class="pane"><div>'+logo()+'</div><div><h1>Gestão completa para o seu negócio de consórcios.</h1><p class="muted" style="margin-top:10px">Leads, simulações e cotas organizadas.</p></div><div/></section>'+
    '<section class="login-form-wrap"><form class="login-box" data-form="login">'+logo()+
    '<div><h2>Entrar</h2><p class="muted">Acesse seu painel de vendas.</p></div>'+
    '<div class="err" id="lg-err" hidden>Usuário ou senha incorretos.</div>'+
    '<div class="field"><label>Usuário</label><input id="lg-user" autocomplete="username"></div>'+
    '<div class="field"><label>Senha</label><input id="lg-pass" type="password" autocomplete="current-password"></div>'+
    '<button class="btn btn-primary" type="submit">Entrar</button></form></section></div>';
  }

  function appHTML(){
    var nav=[
      ['dashboard','dash','Dashboard'],
      ['kanban','kanban','Quadros Kanban'],
      ['calendar','cal','Calendário'],
      ['contacts','users','Contatos']
    ].map(function(n){
      return '<button class="nav-i '+(S.view===n[0]?'on':'')+'" data-act="nav" data-view="'+n[0]+'">'+ic(n[1],19)+'<span class="lbl">'+n[2]+'</span></button>';
    }).join('');
    var content=S.view==='dashboard'?dashHTML():S.view==='kanban'?kanbanHTML():S.view==='calendar'?calHTML():contactsHTML();
    return '<div class="app"><aside class="side '+(S.collapsed?'collapsed':'')+'">'+logo()+'<nav class="nav">'+nav+'</nav>'+
    '<div class="side-foot"><button class="nav-i" data-act="collapse">'+ic('panel',19)+'<span class="lbl">Recolher</span></button>'+
    '<button class="nav-i" data-act="theme">'+ic(isDark()?'sun':'moon',19)+'<span class="lbl">Tema</span></button>'+
    '<div class="user"><span class="av">PT</span><div class="muted lbl" style="font-size:12px"><b>Pedro Takahashi</b></div></div>'+
    '<button class="nav-i" data-act="logout">'+ic('out',19)+'<span class="lbl">Sair</span></button></div></aside>'+
    '<main class="main">'+content+'</main></div>';
  }

  function topbar(t,sub,acts){
    return '<div class="top"><div><h1>'+t+'</h1>'+(sub?'<p class="muted">'+sub+'</p>':'')+'</div><div class="filters">'+(acts||'')+'</div></div>';
  }

  function dashHTML(){
    var s=stats();
    var rows=S.leads.map(function(l){
      return '<tr><td><div class="who"><span class="av">'+initials(l.name)+'</span><div><div class="nm">'+esc(l.name)+'</div><div class="muted" style="font-size:12px">'+esc(l.phone)+'</div></div></div></td>'+
      '<td class="num">'+brl(l.creditValue)+'</td><td>'+ST[l.status].label+'</td><td class="muted num">'+l.date+'</td></tr>';
    }).join('');
    return topbar('Dashboard','Resumo de consórcios','<button class="btn btn-primary" data-act="new-lead">'+ic('plus',16)+'Novo Lead</button>')+
    '<div class="kpis">'+
      '<div class="kpi"><div class="kpi-top"><span>Total Leads</span><span class="chip-ic t-violet">'+ic('users')+'</span></div><div class="kpi-val">'+s.total+'</div></div>'+
      '<div class="kpi"><div class="kpi-top"><span>Em Negociação</span><span class="chip-ic t-blue">'+ic('send')+'</span></div><div class="kpi-val">'+brl(s.sentV)+'</div></div>'+
      '<div class="kpi"><div class="kpi-top"><span>Vendas Realizadas</span><span class="chip-ic t-green">'+ic('filecheck')+'</span></div><div class="kpi-val">'+brl(s.wonV)+'</div></div>'+
    '</div>'+
    '<div class="panel"><div class="panel-h"><h2>Últimos Leads</h2></div><div class="tbl-wrap"><table><thead><tr><th>Cliente</th><th class="num">Crédito</th><th>Status</th><th class="num">Data</th></tr></thead><tbody>'+rows+'</tbody></table></div></div>';
  }

  function contactsHTML(){
    var rows=S.leads.map(function(l){
      return '<tr><td><div class="who"><span class="av">'+initials(l.name)+'</span><div><div class="nm">'+esc(l.name)+'</div><div class="muted" style="font-size:12px">'+esc(l.phone)+' · <b>'+esc(l.segment)+'</b></div></div></div></td>'+
      '<td class="num">'+brl(l.creditValue)+'<br><span class="muted">Parc: '+brl(l.installment)+'</span></td>'+
      '<td>'+ST[l.status].label+'</td><td class="muted num">'+l.date+'</td>'+
      '<td><button class="icon-btn danger" data-act="del-lead" data-id="'+l.id+'">'+ic('trash')+'</button></td></tr>';
    }).join('');
    return topbar('Contatos','Lista de clientes de consórcio','<button class="btn btn-primary" data-act="new-lead">'+ic('plus',16)+'Novo Contato</button>')+
    '<div class="panel"><div class="tbl-wrap"><table><thead><tr><th>Cliente</th><th class="num">Crédito</th><th>Status</th><th class="num">Data</th><th></th></tr></thead><tbody>'+rows+'</tbody></table></div></div>';
  }

  function kanbanHTML(){
    var b=curBoard();
    var cols=b.columns.map(function(c){
      var cards=c.cards.map(function(k){return '<div class="card"><div class="card-title">'+esc(k.title)+'</div></div>'}).join('');
      return '<div class="col"><div class="col-head"><h3>'+esc(c.name)+'</h3><span class="count">'+c.cards.length+'</span></div><div class="col-cards">'+cards+'</div></div>';
    }).join('');
    return topbar('Quadros Kanban','Fluxo de atendimento','')+'<div class="cols">'+cols+'</div>';
  }

  function calHTML(){
    return topbar('Calendário','Acompanhamento','')+'<div class="panel"><div class="empty">Calendário de follow-ups ativos.</div></div>';
  }

  function render(){
    applyTheme();
    root.innerHTML=S.session?appHTML():loginHTML();
  }

  /* Modais */
  function openLeadModal(){
    var div=document.createElement('div');
    div.className='overlay';
    div.innerHTML='<div class="modal"><div class="m-head"><h2>Novo Lead / Consórcio</h2></div><form class="m-body" id="lead-form">'+
    '<div class="field"><label>Nome do Cliente</label><input id="lf-name" required></div>'+
    '<div class="row2"><div class="field"><label>Telefone / WhatsApp</label><input id="lf-phone" placeholder="(17) 99999-9999"></div><div class="field"><label>Tipo</label><select id="lf-seg">'+SEGMENTS.map(function(s){return '<option>'+s+'</option>'}).join('')+'</select></div></div>'+
    '<div class="row2"><div class="field"><label>Valor Crédito (R$)</label><input id="lf-cred" type="number" required></div><div class="field"><label>Parcela (R$)</label><input id="lf-inst" type="number"></div></div>'+
    '<div class="m-foot"><button type="button" class="btn" data-close>Cancelar</button><button type="submit" class="btn btn-primary">Salvar</button></div>'+
    '</form></div>';
    div.addEventListener('click',function(e){if(e.target===div||e.target.hasAttribute('data-close'))div.remove()});
    div.querySelector('form').addEventListener('submit',function(e){
      e.preventDefault();
      S.leads.push({
        id:uid(), name:document.getElementById('lf-name').value, phone:document.getElementById('lf-phone').value,
        segment:document.getElementById('lf-seg').value, creditValue:parseFloat(document.getElementById('lf-cred').value)||0,
        installment:parseFloat(document.getElementById('lf-inst').value)||0, status:'negociacao', date:today(), notes:''
      });
      div.remove();
      commit();
    });
    document.body.appendChild(div);
  }

  /* Eventos Globais Únicos */
  document.addEventListener('click',function(e){
    var t=e.target.closest('[data-act]'); if(!t)return;
    var act=t.getAttribute('data-act'), id=t.getAttribute('data-id');
    if(act==='nav'){ S.view=t.getAttribute('data-view'); render(); }
    else if(act==='collapse'){ S.collapsed=!S.collapsed; render(); }
    else if(act==='theme'){ S.theme=isDark()?'light':'dark'; render(); }
    else if(act==='logout'){ S.session=null; render(); }
    else if(act==='new-lead'){ openLeadModal(); }
    else if(act==='del-lead'){ S.leads=S.leads.filter(function(x){return x.id!==id}); commit(); }
  });

  document.addEventListener('submit',function(e){
    var f=e.target.closest('form[data-form="login"]'); if(!f)return;
    e.preventDefault();
    var u=document.getElementById('lg-user').value.trim(), p=document.getElementById('lg-pass').value;
    if(u===USER && p===PASS){ S.session={user:USER}; commit(); }
    else { document.getElementById('lg-err').hidden=false; }
  });

  render();
})();
</script>
</body>
</html>
